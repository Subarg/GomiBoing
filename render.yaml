# Blueprint de Render: API Laravel (Docker), SPA Vue (estático) y PostgreSQL gestionado.
databases:
  - name: gomiboing-db
    plan: free
    databaseName: gomiboing

services:
  - type: web
    name: gomiboing-api
    runtime: docker
    rootDir: api-gomiboing
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false          # genera con: php artisan key:generate --show
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase: { name: gomiboing-db, property: connectionString }
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: array
      - key: FRONTEND_URL
        sync: false          # URL del Static Site, ej. https://gomiboing.onrender.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_VENDEDOR_PASSWORD
        sync: false

  - type: web
    name: gomiboing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # ej. https://gomiboing-api.onrender.com/api
